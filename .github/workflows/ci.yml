name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Smoke (quickstart is the test)
        shell: bash
        run: |
          go build -o hive_bin ./cmd/hive
          ./hive_bin --version
          ./hive_bin doctor || true   # optional tools may be absent on runners
          mkdir smoke && cd smoke
          ../hive_bin init --name smoke --intent "CI smoke test"
          ../hive_bin check
