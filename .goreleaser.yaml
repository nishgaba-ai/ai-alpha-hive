version: 2
project_name: hive

builds:
  - main: ./cmd/hive
    binary: hive
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/nishgaba-ai/ai-alpha-hive/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "hive_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: git
  filters:
    exclude: ["^docs:", "^ci:"]
